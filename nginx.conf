server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Canonicalize URLs: strip trailing slash (except `/`). The sitemap and
    # internal links never use a trailing slash, so a 301 keeps `/fr/positions/6v6`
    # and `/fr/positions/6v6/` from being treated as two pages, and prevents the
    # 403 that nginx would otherwise return for directories that don't contain
    # an index.html (e.g. /fr/positions/6v6/ when only /fr/positions/6v6/4-2/index.html exists).
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        # Serve the file if present, otherwise the directory's index.html if any,
        # otherwise fall back to the SPA shell. Critically we never use the bare
        # `$uri/` form: it would trigger nginx's autoindex/403 for directories
        # without an index file.
        try_files $uri $uri/index.html /index.html;
    }

    # Content published for the mobile app (scripts/build-content.mjs). A
    # missing file is a real 404, never the SPA shell. The app revalidates on
    # every open (ETag + no-cache), may run as a web page (CORS), and refuses a
    # response without Content-Length, so this location is never gzipped.
    location ^~ /content/ {
        try_files $uri =404;
        gzip off;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
